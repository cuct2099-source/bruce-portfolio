.video-list{

}

/* 單一影片 */
.video-card{
    margin-bottom:40px;
    overflow:hidden;
    background:black;
    display:block;
}
/* iframe 比例 */
.video{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
    height:0;
}

/* 封面圖 */
.video-card img{
    width:100%;
    display:block;

}
.video iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:0;
}

/* 返回 */
.back{
    text-align:center;
    padding:50px;
}

.back a{
    background:black;
    color:white;
    text-decoration:none;
    padding:14px 30px;
