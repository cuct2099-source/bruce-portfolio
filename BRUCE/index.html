<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bruce Portfolio</title>

<style>

.hero{
    height: 70vh;
    background-image: url("images/0004.png");
    background-size: cover;
    background-position: center;
    position: relative;
}

.hero-text{
    position: absolute;
    top: 42%;
    left: 22%;
    color: white;
}

.hero-text h1{
    font-size: 28px;
    letter-spacing: 2px;
    margin: 0;
    font-weight: 400;
}

.hero-text p{
    font-size: 16px;
    font-weight: bold;
}

body{
    margin:0;
    background:#3a3a3a;
    font-family:Arial,sans-serif;
    color:white;
}

/* 上方選單 */
nav{
    background:black;
    padding:22px;
    display:flex;
    justify-content:center;
    gap:40px;
    font-size:14px;
}

nav a{
    color:white;
    text-decoration:none;
}

/* 主區塊 */
.container{
    max-width:1300px;
    margin:auto;
    padding:40px;
    display:grid;
    grid-template-columns:1fr 420px;
    gap:60px;
}

/* 分類 */
.category{
    margin-bottom:40px;
    position:relative;
}

.category img{
    width:100%;
    height:260px;
    object-fit:cover;
    display:block;
}

.category button{
    position:absolute;
    bottom:20px;
    left:20px;
    background:black;
    color:white;
    border:none;
    padding:14px 24px;
    font-size:14px;
    cursor:pointer;
}

/* 個人資訊 */
.profile{
    text-align:center;
}

.profile img{
    width:240px;
    height:240px;
    border-radius:50%;
    object-fit:cover;
}

.profile h1{
    letter-spacing:5px;
    margin-top:25px;
}

.contact{
    margin-top:30px;
    text-align:left;
    line-height:2;
    font-size:20px;
}

.contact a{
    color:white;
}

.contact-btn{
    margin-top:80px;
}

.contact-btn a{
    background:white;
    color:black;
    padding:16px 35px;
    text-decoration:none;
    font-weight:bold;
}

/* 手機 */
@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<section class="hero">
  <div class="hero-text">
    <h1>BRUCE</h1>
    <p>Videographer | Photographer | Editor</p>
  </div>
</section>

    <a href="#">HOME｜主頁</a>
    <a href="video.html">VIDEO｜動態影片</a>
    <a href="photo.html">PHOTO｜平面作品</a>
    <a href="#contact">CONTACT｜聯繫我</a>
</nav>

<div class="container">

    <!-- 左邊分類 -->
    <div>

        <!-- VIDEO -->
        <a href="video.html">

            <div class="category">

                <img src="images/08.jpg">

                <button>VIDEO｜動態影片</button>

            </div>

        </a>

        <!-- PHOTO -->
        <a href="photo.html">

            <div class="category">

                <img src="images/09.jpg">

                <button>PHOTO｜平面作品</button>

            </div>

        </a>

    </div>

    <!-- 右邊資訊 -->
    <div class="profile" id="contact">

        <img src="images/002.jpg">

        <h1>BRUCE</h1>

        <div class="contact">

            Email：
            <a href="mailto:cuct2099@gmail.com">
            cuct2099@gmail.com
            </a>

            <br>

            Instagram：
            <a href="https://www.instagram.com/rubestunack/" target="_blank">
            @bruce
            </a>

            <br>

            Line：0909336422

        </div>

        <div class="contact-btn">
            <a href="#contact">
            CONTACT ME
            </a>
        </div>

    </div>

</div>

</body>
</html>
