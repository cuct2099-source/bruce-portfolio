<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<title>PHOTO WORKS</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

nav{
    background:#000;
    padding:22px;
    text-align:center;
    border-bottom:1px solid #222;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 25px;
    font-size:14px;
    font-weight:bold;
}

h1{
    text-align:center;
    padding:45px 20px 20px;
    letter-spacing:4px;
}

.gallery{
    max-width:1100px;
    margin:0 auto 90px;
    padding:20px;
    position:relative;
}

.play-btn{
    position:absolute;
    top:34px;
    left:34px;
    background:rgba(0,0,0,.55);
    color:white;
    padding:7px 12px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    z-index:5;
}

.main-photo{
    width:100%;
    max-height:620px;
    object-fit:contain;
    display:block;
    margin:auto;
    background:#000;
}

.thumbs{
    display:flex;
    gap:6px;
    margin-top:14px;
    overflow-x:auto;
    padding-bottom:8px;
}

.thumbs img{
    width:62px;
    height:62px;
    object-fit:cover;
    cursor:pointer;
    opacity:.55;
    transition:.2s;
}

.thumbs img:hover,
.thumbs img.active{
    opacity:1;
}

.back{
    text-align:center;
    padding:50px;
}

.back a{
    background:white;
    color:black;
    padding:14px 30px;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<script>
document.querySelectorAll(".gallery").forEach(function(gallery){

    const mainPhoto = gallery.querySelector(".main-photo");
    const thumbs = gallery.querySelectorAll(".thumbs img");
    const playBtn = gallery.querySelector(".play-btn");

    let index = 0;
    let playing = false;
    let timer = null;

    function showPhoto(i){
        thumbs.forEach(function(t){
            t.classList.remove("active");
        });

        thumbs[i].classList.add("active");
        mainPhoto.src = thumbs[i].src;
        index = i;
    }

    thumbs.forEach(function(thumb, i){
        thumb.addEventListener("click", function(){
            showPhoto(i);
        });
    });

    playBtn.addEventListener("click", function(){
        if(!playing){
            playing = true;
            playBtn.innerHTML = "Pause ❚❚";

            timer = setInterval(function(){
                index = (index + 1) % thumbs.length;
                showPhoto(index);
            }, 3000);

        }else{
            playing = false;
            playBtn.innerHTML = "Play ▶";
            clearInterval(timer);
        }
    });

});
</script>
